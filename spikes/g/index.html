<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spike G — fractional zoom text sharpness</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #11151c;
        color: #d9e1ee;
      }
      body {
        margin: 0;
        padding: 20px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        align-items: center;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      label,
      button {
        font: inherit;
        font-size: 12px;
      }
      button {
        color: #d9e1ee;
        background: #253044;
        border: 1px solid #53627c;
        border-radius: 4px;
        padding: 5px 8px;
      }
      button:hover {
        background: #33415a;
      }
      #ready-state {
        color: #8ee0a4;
        min-width: 280px;
      }
      #results-log {
        white-space: pre-wrap;
        color: #aab7c8;
        font-size: 11px;
        min-height: 32px;
        margin: 0 0 14px;
      }
      .comparison {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figcaption {
        font-size: 12px;
        margin: 0 0 6px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 520px;
        background: #181e28;
        border: 1px solid #35435a;
      }
      @media (max-width: 900px) {
        .comparison {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Spike G — fractional zoom text sharpness</h1>
      <label
        >Zoom
        <input id="zoom" type="number" min="0.4" max="4" step="0.01" value="1"
      /></label>
      <label
        >Atlas switching
        <select id="switch-mode">
          <option value="mid-gesture">mid-gesture</option>
          <option value="debounced">debounced</option>
        </select></label
      >
      <button id="copy-results" type="button">Copy results as JSON</button>
      <span id="ready-state">loading reference text…</span>
    </header>
    <p id="results-log" aria-live="polite"></p>
    <section class="comparison" aria-label="text rendering comparison">
      <figure>
        <figcaption id="atlas-caption">Discrete-size atlas</figcaption>
        <canvas id="discrete-canvas" width="1000" height="520"></canvas>
      </figure>
      <figure>
        <figcaption>Single-channel SDF stand-in for MSDF</figcaption>
        <canvas id="sdf-canvas" width="1000" height="520"></canvas>
      </figure>
    </section>
    <script type="module" src="/spikes/g/main.ts"></script>
  </body>
</html>
