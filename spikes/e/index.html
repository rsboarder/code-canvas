<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Spike E — Detail Level transition</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        margin: 0;
        background: #111827;
        color: #d1d5db;
      }
      header {
        padding: 12px 16px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      button {
        background: #2563eb;
        border: 0;
        color: white;
        padding: 7px 10px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      #status,
      #results {
        margin: 0;
        padding: 8px 16px;
        white-space: pre-wrap;
        font-size: 12px;
      }
      #scene {
        display: block;
        width: 100vw;
        height: calc(100vh - 132px);
        background: #0b1020;
      }
      #results {
        max-height: 120px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Spike E — Detail Level switch at worst-case density</strong>
      <button id="run" type="button">Run zoom sweep</button>
      <button id="copy" type="button">Copy results as JSON</button>
    </header>
    <pre id="status">Starting…</pre>
    <canvas id="scene" aria-label="Spike E WebGL scene"></canvas>
    <pre id="results">No measurement yet.</pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
